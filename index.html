<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>คำนวณเบี้ยอย่างง่าย</title>

<!-- Add to Home Screen: app name + icon -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B2A55">
<meta name="application-name" content="คำนวณเบี้ยอย่างง่าย">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="คำนวณเบี้ยอย่างง่าย">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap');
  body { margin:0; font-family:'IBM Plex Sans Thai','Prompt',sans-serif; background:#EFF7FB; font-weight:500; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #loading-msg { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:#0B2A55; }
  .spinner { width:36px; height:36px; border:4px solid #D7E8F0; border-top-color:#0B2A55; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"><div id="loading-msg"><div><div class="spinner"></div>กำลังโหลดแอป...</div></div></div>

<script>
// ---- Robust loader: tries a primary CDN, falls back to a second CDN, and shows a clear error if both fail ----
function loadScript(url, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = url;
    s.crossOrigin = 'anonymous';
    var done = false;
    var t = setTimeout(function () {
      if (done) return;
      done = true;
      s.remove();
      reject(new Error('timeout loading ' + url));
    }, timeoutMs || 8000);
    s.onload = function () {
      if (done) return;
      done = true;
      clearTimeout(t);
      resolve();
    };
    s.onerror = function () {
      if (done) return;
      done = true;
      clearTimeout(t);
      s.remove();
      reject(new Error('failed to load ' + url));
    };
    document.head.appendChild(s);
  });
}

function loadFirstAvailable(urls, timeoutMs) {
  var i = 0;
  function attempt() {
    if (i >= urls.length) return Promise.reject(new Error('all sources failed: ' + urls.join(', ')));
    var url = urls[i++];
    return loadScript(url, timeoutMs).catch(function () { return attempt(); });
  }
  return attempt();
}

function showFatalError(detail) {
  var root = document.getElementById('root');
  root.innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;">' +
    '<div style="max-width:360px;">' +
    '<div style="font-size:44px;margin-bottom:12px;">📶</div>' +
    '<div style="font-size:19px;font-weight:700;color:#0B2A55;margin-bottom:8px;">โหลดแอปไม่สำเร็จ</div>' +
    '<div style="font-size:14px;color:#4A6178;margin-bottom:18px;line-height:1.6;">' +
    'อินเทอร์เน็ตอาจไม่เสถียร หรือเครือข่ายบล็อกการโหลดไฟล์บางส่วน<br>ลองกดปุ่มด้านล่าง หรือสลับ WiFi/เน็ตมือถือแล้วลองใหม่' +
    '</div>' +
    '<button onclick="location.reload()" style="background:#0B2A55;color:#fff;border:none;padding:12px 28px;border-radius:14px;font-size:16px;font-weight:600;">ลองใหม่อีกครั้ง</button>' +
    '</div></div>';
  console.error('Fatal load error:', detail);
}

(function boot() {
  loadFirstAvailable([
    'https://unpkg.com/react@18/umd/react.production.min.js',
    'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js'
  ], 8000)
  .then(function () {
    return loadFirstAvailable([
      'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
      'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js'
    ], 8000);
  })
  .then(function () {
    // Tailwind styles are non-critical for functionality — load best-effort without blocking the app
    loadFirstAvailable([
      'https://cdn.tailwindcss.com',
      'https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4'
    ], 6000).catch(function () {});
    return loadScript('app.js', 8000);
  })
  .then(function () {
    if (typeof window.__mountApp === 'function') {
      window.__mountApp();
    } else {
      showFatalError('app.js loaded but __mountApp is missing');
    }
  })
  .catch(function (e) {
    showFatalError(e && e.message);
  });
})();
</script>
</body>
</html>
