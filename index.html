    // โหลดข้อมูลที่บันทึกไว้ล่าสุด (ถ้ามี) ตอนเปิดแอปครั้งแรก
    useEffect(() => {
        (async () => {
            const raw = await storageAdapter.get(STORAGE_KEY);
            if (raw) {
                try {
                    const s = JSON.parse(raw);
                    if (s.gender)
                        setGender(s.gender);
                    if (s.age !== undefined)
                        setAge(s.age);
                    if (s.occClass)
                        setOccClass(s.occClass);
                    if (s.payMode)
                        setPayMode(s.payMode);
                    if (s.mainSI !== undefined)
                        setMainSI(s.mainSI);
                    if (s.selected)
                        setSelected(s.selected);
                    if (s.accPlan !== undefined)
                        setAccPlan(s.accPlan);
                    if (s.acc3Plan !== undefined)
                        setAcc3Plan(s.acc3Plan);
                    if (s.tpdSI !== undefined)
                        setTpdSI(s.tpdSI);
                    if (s.supSI !== undefined)
                        setSupSI(s.supSI);
                    if (s.vhPlan !== undefined)
                        setVhPlan(s.vhPlan);
                    if (s.rpprDaily !== undefined)
                        setRpprDaily(s.rpprDaily);
                    if (s.hhpPlan !== undefined)
                        setHhpPlan(s.hhpPlan);
                    if (s.hhpDeduct !== undefined)
                        setHhpDeduct(s.hhpDeduct);
                    if (s.csPayorAge !== undefined)
                        setCsPayorAge(s.csPayorAge);
                    if (s.csPayorGender)
                        setCsPayorGender(s.csPayorGender);
                }
                catch (e) { }
            }
            setLoadedFromStorage(true);
        })();

    /* ---- per-product calculators ---- */
    function calcSUD() {
        if (age < SUD_MIN_AGE || age > SUD_MAX_AGE)
            return { ok: false, msg: `อายุรับประกัน ${SUD_MIN_AGE}-${SUD_MAX_AGE} ปี` };
        if (occClass === 3)
            return { ok: false, msg: "ตลอดชีพ สุดคุ้ม รับประกันเฉพาะชั้นอาชีพ 1-2 เท่านั้น (ไม่รับชั้นอาชีพ 3)" };
        if (mainSI < 100000)
            return { ok: false, msg: "จำนวนเงินเอาประกันภัยขั้นต่ำ 100,000 บาท" };
        const rate = (gender === "female" ? SUD_FEMALE : SUD_MALE)[age] - sudDiscount(mainSI);
        const premium = (rate * mainSI) / 1000;
        return { ok: true, premium, benefits: [
                ["เสียชีวิตทุกกรณี", baht(mainSI) + " (หรือเบี้ยสะสม แล้วแต่มากกว่า)"],
                ["เสียชีวิตจากอุบัติเหตุ รับเพิ่ม", baht(Math.round(mainSI * 0.5)) + " (รวมเป็น " + baht(Math.round(mainSI * 1.5)) + ")"],
                ["ทุพพลภาพถาวรสิ้นเชิง", baht(Math.min(Math.round(mainSI * 0.5), 5000000)) + " (สูงสุด 5,000,000 บาท)"],
                ["ระยะเวลาคุ้มครองอุบัติเหตุ/ทุพพลภาพ", "20 ปีกรมธรรม์แรก หรือถึงอายุ 60 ปี แล้วแต่มากกว่า"],
                ["มีชีวิตอยู่จนครบกำหนดสัญญา (อายุ 99 ปี)", "รับ " + baht(mainSI)],
                ["ระยะเวลาคุ้มครอง", "รับประกันตั้งแต่อายุแรกเกิด (0 ปี) ถึง 70 ปี ชำระเบี้ย 20 ปี คุ้มครองตลอดชีพจนถึงอายุ 99 ปี"],
            ] };
    }
    function calcACC() {
        const bi = bandIndex(age, ACC_BANDS);
        if (bi < 0)
            return { ok: false, msg: "อายุรับประกัน 0-70 ปี (ต่ออายุได้ถึง 98 ปี)" };
        if (mainSI < 50000)
            return { ok: false, msg: "ต้องมีทุนประกันตลอดชีพ สุดคุ้ม (ด้านบน) ขั้นต่ำ 50,000 บาท จึงจะซื้อ แอคซิเดนท์ แคร์ ได้" };
        const pi = ACC_PLANS.indexOf(accPlan);
        if (pi < 0)
            return { ok: false, msg: "กรุณาเลือกแผนความคุ้มครอง" };
        const premium = ACC_RATES[occClass][bi][pi];
        const b = ACC_BENEFIT(accPlan);
        return { ok: true, premium, benefits: [
                ["เสียชีวิต / สูญเสียอวัยวะ 2 ข้าง / ตาบอด 2 ข้าง", baht(b.death) + " (100%)"],
                ["สูญเสียอวัยวะ 1 ข้าง / ตาบอด 1 ข้าง", baht(b.loss1) + " (60%)"],
                ["นิ้วหัวแม่มือ + นิ้วชี้", baht(b.fingers) + " (25%)"],
                ["ค่ารักษาพยาบาลอุบัติเหตุ ต่อครั้ง", baht(b.medExpense)],
                ["กระดูกแตกหัก / ไฟไหม้ / น้ำร้อนลวก", baht(b.fracture)],
                ["อุบัติเหตุวันหยุดนักขัตฤกษ์ / รถสาธารณะ", "รับเพิ่มอีก 1 เท่าของผลประโยชน์ข้างต้น"],
                ["ระยะเวลาคุ้มครอง", "รับประกันตั้งแต่อายุแรกเกิด (0 ปี) ถึง 70 ปี และสามารถต่ออายุความคุ้มครองต่อเนื่องได้ถึงอายุ 98 ปี"],
            ] };

    function calcACC3() {
        if (age < 0 || age > 64)
            return { ok: false, msg: "อายุรับประกัน 0-64 ปี (คุ้มครองถึงอายุ 65 ปี)" };
        if (mainSI < 50000)
            return { ok: false, msg: "ต้องมีทุนประกันตลอดชีพ สุดคุ้ม (ด้านบน) ขั้นต่ำ 50,000 บาท จึงจะซื้อ อบ.3 พลัส ได้" };
        const maxPlan = ACC3_MAX_BY_SI(mainSI);
        if (acc3Plan <= 0)
            return { ok: false, msg: "กรุณาเลือกวงเงินค่ารักษาพยาบาล" };
        if (acc3Plan > maxPlan)
            return { ok: false, msg: `ทุนประกันหลัก ${baht(mainSI)} ซื้อ อบ.3 พลัส ได้สูงสุดแผน ${baht(maxPlan)} (ทุนหลักตั้งแต่ 50,000 บาท ซื้อได้สูงสุด 10,000 / ทุนหลักตั้งแต่ 100,000 บาท ซื้อได้สูงสุด 15,000)` };
        const premium = ACC3_RATES[occClass][acc3Plan];
        return { ok: true, premium, benefits: [
                ["วงเงินค่ารักษาพยาบาล ต่อครั้ง", baht(acc3Plan)],
                ["ความคุ้มครอง", "จ่ายตามจริงจากอุบัติเหตุ ไม่เกินวงเงินที่ซื้อ ทั่วโลกตลอด 24 ชม."],
                ["ระยะเวลาคุ้มครอง", "รับประกันตั้งแต่อายุแรกเกิด (0 ปี) ถึง 64 ปี และสามารถต่ออายุความคุ้มครองต่อเนื่องได้ถึงอายุ 65 ปี"],
                ["เงื่อนไขทุนประกันหลัก", "ทุนหลักตั้งแต่ 50,000 บาท ซื้อได้สูงสุด 10,000 / ทุนหลักตั้งแต่ 100,000 บาท ซื้อได้สูงสุด 15,000"],
            ] };
    }
    function calcTPD() {
        if (age < TPD_MIN_AGE || age > TPD_MAX_AGE)
            return { ok: false, msg: `อายุรับประกัน ${TPD_MIN_AGE}-65 ปี (ต่ออายุถึง ${TPD_MAX_AGE} ปี)` };
        const maxSI = Math.min(mainSI * 10, 30000000);
        if (mainSI <= 0)
            return { ok: false, msg: "ต้องระบุทุนประกันตลอดชีพ สุดคุ้ม (ด้านบน) ก่อนจึงจะซื้อทุพพลภาพ โพรเทค ได้" };
        if (tpdSI > maxSI)
            return { ok: false, msg: `ทุนประกันสูงสุด ${baht(maxSI)} (ไม่เกิน 10 เท่าของทุนประกันหลัก ${baht(mainSI)} และไม่เกิน 30,000,000 บาท)` };
        const idx = age - TPD_MIN_AGE;
        const rate = (gender === "female" ? TPD_FEMALE : TPD_MALE)[idx];
        const premium = (rate * tpdSI) / 1000;
        return { ok: true, premium, benefits: [
                ["จำนวนเงินเอาประกันภัย", baht(tpdSI)],
                ["เงื่อนไขจ่ายผลประโยชน์", "ทุพพลภาพถาวรสิ้นเชิง ต่อเนื่อง ≥180 วัน จ่าย 100% ของทุนประกัน"],
                ["ระยะเวลาคุ้มครอง", "รับประกันตั้งแต่อายุ 15 ถึง 65 ปี และสามารถต่ออายุความคุ้มครองต่อเนื่องได้ถึงอายุ 74 ปี"],
                ["เงื่อนไขทุนประกันหลัก", `ซื้อได้ไม่เกิน 10 เท่าของทุนประกันหลัก (สูงสุด ${baht(maxSI)}) และไม่เกิน 30,000,000 บาทรวมทุกกรมธรรม์`],
            ] };
    }
    function calcSUPER() {
        if (age < SUPER_MIN_AGE || age > SUPER_MAX_AGE)
            return { ok: false, msg: `อายุรับประกัน ${SUPER_MIN_AGE}-65 ปี (ต่ออายุได้ถึง ${SUPER_MAX_AGE} ปี)` };
        if (supSI < SUPER_MIN_SI)
            return { ok: false, msg: "ทุนประกันขั้นต่ำ 100,000 บาท" };
        if (supSI > SUPER_MAX_SI)
            return { ok: false, msg: "ทุนประกันสูงสุด 3,000,000 บาทต่อกรมธรรม์ (รวมทุกฉบับไม่เกิน 5,000,000 บาท เมื่อรวมกับสัญญาคุ้มครองโรคร้ายแรง/มรณกรรมอื่น)" };
        const idx = age - SUPER_MIN_AGE;
        const rate = (gender === "female" ? SUPER_FEMALE : SUPER_MALE)[idx];
        const premium = (rate * supSI) / 1000;
        return { ok: true, premium, benefits: [
                ["กลุ่มโรคมะเร็งและเนื้องอกในสมอง", baht(supSI) + " (100%)"],
                ["กลุ่มโรคหัวใจและหลอดเลือด", baht(supSI) + " (100%, บางรายการ 50% สูงสุด 500,000 บาท)"],
                ["กลุ่มโรคอวัยวะ/ระบบการทำงานสำคัญ (ไต ตับ ปอด ฯลฯ)", baht(supSI) + " (100%)"],
                ["กลุ่มภาวะติดเชื้อ/บาดเจ็บรุนแรง", baht(supSI) + " (100%)"],
                ["กลุ่มโรคร้ายแรงอื่นๆ (ตาบอด อัลไซเมอร์ พาร์กินสัน ฯลฯ)", baht(supSI) + " (100%)"],
                ["กลุ่มโรคร้ายแรงในเด็กก่อนอายุ 17 ปีบริบูรณ์", baht(Math.round(supSI * 0.5)) + " (50%)"],
                ["ครอบคลุมทั้งหมด", "47 โรค/ภาวะ"],
                ["ระยะเวลาคุ้มครอง", "รับประกันตั้งแต่อายุ 1 ถึง 65 ปี และสามารถต่ออายุความคุ้มครองต่อเนื่องได้ถึงอายุ 79 ปี"],
            ] };
    }
    function calcVH() {
        const bi = bandIndex(age, VH_BANDS);
        if (bi < 0)
            return { ok: false, msg: "อายุรับประกัน 11-80 ปี (คุ้มครองถึงอายุ 98 ปี)" };
        if (mainSI < 50000)
            return { ok: false, msg: "ต้องมีทุนประกันตลอดชีพ สุดคุ้ม (ด้านบน) ขั้นต่ำ 50,000 บาท จึงจะซื้อ แวลู เฮลธ์ ได้" };
        const occGroup = occClass === 3 ? "c3" : "c12";
        const pi = VH_PLANS.indexOf(vhPlan);
        if (pi < 0)
            return { ok: false, msg: "กรุณาเลือกแผนความคุ้มครอง" };
        const premium = VH_TABLE[gender][occGroup][bi][pi];
        return { ok: true, premium, benefits: [
                ...catRows(VH_CATS, vhPlan),
                ["ระยะเวลาคุ้มครอง", "รับประกันตั้งแต่อายุ 11 ถึง 80 ปี และสามารถต่ออายุความคุ้มครองต่อเนื่องได้ถึงอายุ 98 ปี"],
                ["หมายเหตุ", "*หมวดที่ 9-11 ใช้วงเงินตามเอกสารแนบ โปรดตรวจสอบตัวเลขแยกแต่ละหมวดกับตารางฉบับเต็มก่อนนำเสนอลูกค้า"],
            ] };
    }
    function calcRPPR() {
        const bi = bandIndex(age, RPPR_BANDS);
        if (bi < 0)
            return { ok: false, msg: "อายุรับประกัน 6-64 ปี (คุ้มครองถึงอายุ 65 ปี)" };
        const range = rpprRange(mainSI);
        if (!range)
            return { ok: false, msg: "ทุนประกันตลอดชีพ สุดคุ้ม (ด้านบน) ต้องขั้นต่ำ 50,000 บาท" };
        if (rpprDaily < range[0] || rpprDaily > range[1])
            return { ok: false, msg: `ทุนหลัก ${baht(mainSI)} เลือกความคุ้มครองได้ ${fmt(range[0])}-${fmt(range[1])} บาท/วัน` };
        const rate100 = (gender === "female" ? RPPR_FEMALE : RPPR_MALE)[bi];
        const premium = (rate100 * rpprDaily) / 100;
        return { ok: true, premium, benefits: [
                ["ผลประโยชน์ต่อวัน (ผู้ป่วยใน)", baht(rpprDaily)],
                ["เข้ารักษาใน ICU และโรคร้ายแรง 4 โรค (มะเร็ง/หัวใจ/หลอดเลือดสมอง)", "จ่าย 2 เท่า"],

                ["เปลี่ยนอวัยวะสำคัญ (หัวใจ ปอด ตับ ไต)", "จ่ายเพิ่มอีก 200 เท่า"],
                ["ระยะเวลาคุ้มครอง", "รับประกันตั้งแต่อายุ 6 ถึง 64 ปี และสามารถต่ออายุความคุ้มครองต่อเนื่องได้ถึงอายุ 65 ปี"],
            ] };

    function calcHHP() {
        const bi = bandIndex(age, HHP_BANDS);
        if (bi < 0)
            return { ok: false, msg: "อายุรับประกัน 11-80 ปี (คุ้มครองถึงอายุ 98 ปี)" };

            return { ok: false, msg: "ต้องมีทุนประกันตลอดชีพ สุดคุ้ม (ด้านบน) ขั้นต่ำ 50,000 บาท จึงจะซื้อ แฮปปี้ เฮลธ์ พรีเมียร์ ได้" };
        const pi = HHP_PLANS.indexOf(hhpPlan);
        const di = HHP_DEDUCT.indexOf(hhpDeduct);
        if (pi < 0)
            return { ok: false, msg: "กรุณาเลือกแผนความคุ้มครอง" };
        if (di < 0)
            return { ok: false, msg: "กรุณาเลือกความรับผิดส่วนแรก" };
        const occGroup = occClass === 3 ? "c3" : "c12";
        const table = HHP_TABLE[gender][occGroup];
        const premium = table[bi][pi][di];
        return { ok: true, premium, benefits: [
                ["วงเงินค่ารักษาผู้ป่วยใน ต่อครั้ง", baht(hhpPlan)],
                ["กรณีป่วยด้วยโรคมะเร็ง/หัวใจ/หลอดเลือดสมอง", baht(hhpPlan + hhpPlan * 0.1)],
                ["ความรับผิดส่วนแรก (Deductible)", hhpDeduct === 0 ? "ไม่มี" : baht(hhpDeduct)],
                ["ชั้นอาชีพ", occClass === 3 ? "ชั้น 3" : "ชั้น 1-2"],
                ...catRows(HHP_CATS, hhpPlan),
                ["ระยะเวลาคุ้มครอง", "รับประกันตั้งแต่อายุ 11 ถึง 80 ปี และสามารถต่ออายุความคุ้มครองต่อเนื่องได้ถึงอายุ 98 ปี"],
                ["หมายเหตุ", "*หมวดที่ 9-11 ใช้วงเงินตามเอกสารแนบ โปรดตรวจสอบตัวเลขแยกแต่ละหมวดกับตารางฉบับเต็มก่อนนำเสนอลูกค้า"],
            ] };
    }
    function calcCS() {
        if (age < 0 || age > 14)
            return { ok: false, msg: "คช. คุ้มครองเฉพาะผู้เยาว์อายุแรกเกิด - 14 ปีเท่านั้น (อ้างอิงอายุด้านบนสุด)" };
        if (csPayorAge < 20 || csPayorAge > 55)
            return { ok: false, msg: "อายุผู้ชำระเบี้ย (ผู้ปกครอง) รับประกัน 20-55 ปี" };
